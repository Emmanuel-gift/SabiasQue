
name: Compilar SabiasQue para iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Verificar Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate --spec project.yml

      - name: Compilar aplicacion iOS
        run: |
          xcodebuild \
            -project SabiasQue.xcodeproj \
            -scheme SabiasQue \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build

      - name: Guardar aplicacion compilada
        uses: actions/upload-artifact@v4
        with:
          name: SabiasQue-iOS
          path: build/Build/Products/Debug-iphonesimulator/SabiasQue.app

