name: Compilar SabiasQue para iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Verificar Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate --spec project.yml

      - name: Compilar aplicacion iOS
        run: |
          xcodebuild \
            -project SabiasQue.xcodeproj \
            -scheme SabiasQue \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build

      - name: Iniciar simulador de iPhone
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m 1 "iPhone" | sed -E 's/.*\(([-A-F0-9]+)\).*/\1/')
          echo "DEVICE=$DEVICE" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Instalar y ejecutar aplicacion
        run: |
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/SabiasQue.app
          xcrun simctl launch "$DEVICE" com.ejemplo.SabiasQue

      - name: Tomar captura de pantalla
        run: |
          sleep 5
          xcrun simctl io "$DEVICE" screenshot pantalla-sabias-que.png

      - name: Guardar captura de pantalla
        uses: actions/upload-artifact@v4
        with:
          name: Captura-SabiasQue
          path: pantalla-sabias-que.png

      - name: Guardar aplicacion compilada
        uses: actions/upload-artifact@v4
        with:
          name: SabiasQue-iOS
          path: build/Build/Products/Debug-iphonesimulator/SabiasQue.app

